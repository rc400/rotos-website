<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loaded Pack | ROTO's TCG</title>
    <meta name="description" content="Browse the current ROTO's TCG loaded pack set and live remaining odds.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./loaded.css">
  </head>
  <body>
    <main class="loaded-app" data-mode="public">
      <header class="loaded-header">
        <a class="brand-mark" href="/" aria-label="ROTO's TCG home">
          <img src="/assets/logo-no-bg.png" alt="ROTO's TCG">
        </a>
        <div class="header-copy">
          <p class="eyebrow">Loaded Pack</p>
          <h1 id="packTitle">Loading pack...</h1>
          <p id="packMeta" class="muted">Live card list and remaining odds.</p>
        </div>
      </header>

      <section class="status-banner" id="statusBanner" hidden></section>

      <section class="panel odds-panel" aria-labelledby="oddsTitle">
        <div class="panel-heading">
          <p class="eyebrow">Remaining Odds</p>
          <h2 id="oddsTitle">Pull chances</h2>
        </div>
        <div class="odds-grid" id="oddsGrid"></div>
      </section>

      <section class="cards-wrap" id="cardsWrap" aria-live="polite"></section>
    </main>

    <div class="image-modal" id="imageModal" hidden>
      <button class="modal-backdrop" type="button" data-close-modal aria-label="Close image preview"></button>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="icon-close" type="button" data-close-modal aria-label="Close image preview">×</button>
        <img id="modalImage" alt="">
        <div>
          <h2 id="modalTitle"></h2>
          <p id="modalMeta" class="muted"></p>
        </div>
      </div>
    </div>

    <script type="module" src="./loaded.js"></script>
  </body>
</html>
